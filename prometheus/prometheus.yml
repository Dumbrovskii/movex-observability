global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus scraping itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  
  - job_name: "movex-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["movex-backend:8000"]
