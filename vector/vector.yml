api:
  enabled: true
  address: "0.0.0.0:8686"

sources:
  docker_logs:
    type: docker_logs
    # Uncomment to scope collection instead of grabbing every container:
    # include_containers: ["movex-backend"]

sinks:
  loki:
    type: loki
    inputs: ["docker_logs"]
    endpoint: "http://loki:3100"
    encoding:
      codec: text
    labels:
      container: "{{ container_name }}"
      image: "{{ image }}"
